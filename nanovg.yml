--- 
GENERATOR:
  PackageName: nanovg
  PackageDescription: "Package nanovg provides Go bindings for nanovg."
  PackageLicense: "THE AUTOGENERATED LICENSE. ALL THE RIGHTS ARE RESERVED BY ROBOTS."
  Includes: ["glad.h", "nanovg.h"]
  Options:
    SafeStrings: true
  FlagGroups:
    - {name: "CFLAGS", flags: [
      "-I${SRCDIR}/include",
      ]}
    - {name: "LDFLAGS", flags: [
      "-ldl -lm -lGL",
      ]}
    - {name: "LDFLAGS", traits: ["linux,amd64"], flags: [
      "-L${SRCDIR}/_libs/ -lnanovg_linux_amd64",
      ]}
PARSER:
  IncludePaths: ["nanovg"]
  SourcesPaths: ["include/nanovg.h"]
  Defines:
    __ARM_PCS_VFP: 1

TRANSLATOR:
  ConstRules:
    defines: expand
    enum: expand
  Rules:
    global:
      - {action: ignore, from: "^nvgText$"}
      - {action: ignore, from: "^nvgText(Box|Bounds|Glyph|Break)"}
      - {action: accept, from: "^nvgl?"}
      - {action: replace, from: "^nvgl?", to: ""}
      - {transform: export}
    private:
      - {transform: unexport}
    const:
      - {action: accept, from: "^NVG_"}
      - {action: replace, from: "^NVG_", to: ""}
      - {transform: lower}
      - {transform: export}
      - {load: snakecase}
    type:
      - {action: accept, from: "^NVG|^FONS|^stbtt"}
      - {action: replace, from: "^NVG", to: ""}
      - {action: replace, from: "lineCap", to: "lineCapKind"}
      - {action: replace, from: "scissor", to: "scissoring"}

      - {transform: export}
  PtrTips:
    function:
      - {target: ^nvg, tips: [sref,sref,sref,sref,sref,sref,sref,sref]}
  MemTips:
    - {target: "^NVG", self: raw}